<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedMed — Emergency Card</title>
<meta name="theme-color" content="#e11d48">
<meta name="description" content="RedMed emergency card — tap the band, phone opens instantly. Allergies, meds, Call 911. No app needed.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-C1hvPyoaWZeOutigq3KMCfreTNjPLTOt12bwoCQOmrA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<link rel="stylesheet" href="../assets/redmed-theme.css">
<style>
  :root {
    --scale: 1;
    --v-scale: 1;
    --pad: calc(16px * var(--scale));
    --radius: calc(22px * var(--scale));
    --inner: calc(12px * var(--scale));
    --btn-pair-h: calc(54px * var(--v-scale));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--page-bg);
    color: var(--ink);
    line-height: 1.45;
  }
  a { color: inherit; text-decoration: none; }
  .shell { height: 100dvh; min-height: 100dvh; display: flex; flex-direction: column; }
  .atmosphere { min-height: 100dvh; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(10px * var(--v-scale) + env(safe-area-inset-top, 0px)) var(--pad) calc(10px * var(--v-scale));
    text-align: center;
    background: rgba(255,247,247,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar span {
    font-size: calc(11px * var(--scale) + var(--type-bump));
    font-weight: 800;
    letter-spacing: 1.2px;
    color: var(--muted);
  }
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 30;
    pointer-events: none; background: rgba(0,0,0,.05);
  }
  .progress > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), rgba(225,29,72,.85));
    transition: width .08s linear;
  }
  .hero {
    color: #fff;
    padding: calc(28px * var(--v-scale)) var(--pad) calc(22px * var(--v-scale));
    background: linear-gradient(135deg, var(--accent) 0%, rgb(191, 18, 61) 100%);
  }
  .hero-kicker {
    margin: 0 0 calc(8px * var(--v-scale));
    font-size: calc(11px * var(--scale) + var(--type-bump));
    font-weight: 800;
    letter-spacing: 1.6px;
    color: rgba(255,255,255,.85);
  }
  .hero h1 {
    margin: 0;
    font-size: calc(30px * var(--scale) + var(--type-bump));
    font-weight: 800;
    letter-spacing: -.5px;
    word-break: break-word;
  }
  .hero-meta {
    margin: calc(8px * var(--v-scale)) 0 0;
    font-size: calc(14px * var(--scale) + var(--type-bump));
    font-weight: 600;
    color: rgba(255,255,255,.9);
  }
  .donor {
    display: inline-block;
    margin-top: calc(10px * var(--v-scale));
    padding: calc(4px * var(--scale)) calc(8px * var(--scale));
    border-radius: 999px;
    background: rgba(255,255,255,.18);
    font-size: calc(10px * var(--scale) + var(--type-bump));
    font-weight: 800;
    color: #fff;
  }
  .content {
    padding: var(--pad);
    padding-bottom: calc(28px * var(--v-scale) + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: calc(18px * var(--v-scale));
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: var(--btn-pair-h);
    border: 0; border-radius: 999px;
    font: inherit; text-align: center; cursor: pointer;
    text-decoration: none;
    box-sizing: border-box;
    padding: 0 calc(18px * var(--scale));
  }
  .btn-call {
    font-size: calc(16px * var(--scale) + var(--type-bump));
    font-weight: 800;
  }
  .btn-ink {
    font-size: calc(16px * var(--scale) + var(--type-bump));
    font-weight: 800;
  }
  .section { display: flex; flex-direction: column; gap: calc(10px * var(--v-scale)); }
  .pill {
    display: inline-block;
    align-self: flex-start;
    font-size: calc(10px * var(--scale) + var(--type-bump));
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: calc(4px * var(--scale)) calc(8px * var(--scale));
    border-radius: 999px;
  }
  .pill-accent { color: var(--accent); background: var(--accent-soft); }
  .pill-muted { color: var(--muted); background: rgba(120,113,108,.1); }
  .list { display: flex; flex-direction: column; gap: calc(7px * var(--v-scale)); }
  .list-crit {
    padding: calc(14px * var(--scale));
    border-radius: var(--inner);
    background: var(--accent-soft);
  }
  .row {
    display: flex; gap: calc(10px * var(--scale)); align-items: flex-start;
  }
  .dot {
    width: calc(5px * var(--scale)); height: calc(5px * var(--scale));
    margin-top: calc(7px * var(--scale)); flex: none;
    border-radius: 50%; background: var(--accent);
  }
  .row span { font-size: calc(15px * var(--scale) + var(--type-bump)); font-weight: 600; }
  .list-plain .row span { font-weight: 500; }
  .contact-card {
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(10px * var(--scale));
    padding: calc(14px * var(--scale));
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 calc(3px * var(--scale)) calc(8px * var(--scale)) rgba(225,29,72,.04);
  }
  .cname { font-weight: 700; font-size: calc(15px * var(--scale) + var(--type-bump)); }
  .crel, .cphone { font-size: calc(12px * var(--scale) + var(--type-bump)); color: var(--muted); margin-top: 2px; }
  .btn-pill {
    flex: none;
    padding: calc(10px * var(--scale)) calc(14px * var(--scale));
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: calc(13px * var(--scale) + var(--type-bump));
    font-weight: 800;
  }
  .note {
    font-size: calc(12px * var(--scale) + var(--type-bump));
    font-weight: 600;
    color: var(--muted);
    margin: 0;
  }
  .trauma-toggle {
    width: 100%; border: 0; background: none; padding: 0;
    display: flex; align-items: center; justify-content: space-between;
    font: inherit; cursor: pointer; color: var(--ink);
  }
  .trauma-toggle span {
    font-size: calc(14px * var(--scale) + var(--type-bump));
    font-weight: 800;
  }
  .trauma-toggle svg { width: calc(12px * var(--scale)); fill: var(--muted); transition: transform .2s; }
  .trauma-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .trauma-panel {
    display: none;
    margin-top: calc(12px * var(--v-scale));
    padding: calc(14px * var(--v-scale));
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 calc(3px * var(--scale)) calc(8px * var(--scale)) rgba(225,29,72,.04);
  }
  .trauma-panel.open { display: block; }
  .trauma-panel .trauma-eyebrow { margin-bottom: calc(10px * var(--v-scale)); }
  .trauma-panel p { margin: 0 0 calc(8px * var(--v-scale)); font-size: calc(12px * var(--scale) + var(--type-bump)); color: var(--muted); }
  .trauma-panel p.lead { font-weight: 700; color: rgba(28,25,23,.85); }
  .field { margin-bottom: calc(10px * var(--v-scale)); }
  .field label {
    display: block; margin-bottom: calc(4px * var(--v-scale));
    font-size: calc(11px * var(--scale) + var(--type-bump)); font-weight: 700; color: var(--muted);
  }
  .field select {
    width: 100%; padding: calc(10px * var(--scale));
    font: inherit; font-size: calc(14px * var(--scale) + var(--type-bump));
    border: 1px solid var(--line); border-radius: calc(10px * var(--scale));
    background: #fff; color: var(--ink);
  }
  .hospital-card {
    display: flex; gap: calc(10px * var(--scale)); align-items: flex-start;
    padding: calc(10px * var(--v-scale)); margin-top: calc(8px * var(--v-scale));
    background: rgba(255,255,255,.82);
    border: 1px solid var(--line);
    border-radius: var(--inner);
  }
  .hospital-card h3 {
    margin: 0; font-size: calc(14px * var(--scale) + var(--type-bump)); font-weight: 800;
  }
  .hospital-card p { margin: calc(2px * var(--v-scale)) 0 0; font-size: calc(11px * var(--scale) + var(--type-bump)); color: var(--muted); font-weight: 600; }
  .hospital-card p.trauma-dist { color: var(--medical); font-weight: 800; }
  .btn-maps {
    flex: none; align-self: center;
    padding: calc(7px * var(--scale)) calc(10px * var(--scale));
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: calc(11px * var(--scale) + var(--type-bump)); font-weight: 800;
  }
  .empty {
    max-width: min(420px, 100%); margin: 0 auto;
    padding: calc(48px * var(--v-scale)) var(--pad);
    padding-top: calc(48px * var(--v-scale) + env(safe-area-inset-top, 0px));
    text-align: center;
  }
  .empty h1 { margin: calc(10px * var(--v-scale)) 0 calc(6px * var(--v-scale)); font-size: calc(25px * var(--scale) + var(--type-bump)); font-weight: 800; }
  .empty p { margin: 0; font-size: calc(14px * var(--scale) + var(--type-bump)); color: var(--muted); font-weight: 550; }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
<div id="root"></div>
<script src="../assets/trauma-hospitals.js"></script>
<script>
(function () {
  "use strict";

  var LIMITS = {
    name: 120, dob: 32, blood: 16, listItem: 80, listMax: 32,
    contactName: 80, contactPhone: 32, contactRel: 160, contactsMax: 4,
    dEncodedMax: 8192
  };
  var BASELINE_W = 393;
  var BASELINE_VIEWPORT_H = 710;
  var TRAUMA_STATE_KEY = "redMedTraumaState";
  var TRAUMA_CITY_KEY = "redMedTraumaCity";

  function applyLayoutScale() {
    var w = window.innerWidth;
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    h = Math.max(480, h);
    var blended = (w / BASELINE_W) * 0.38 + (h / BASELINE_VIEWPORT_H) * 0.62;
    var scale = Math.min(0.83, Math.max(0.62, blended));
    var vf = h < 620 ? 0.82 : h < 680 ? 0.88 : h < 740 ? 0.93 : 1;
    document.documentElement.style.setProperty("--scale", scale.toFixed(4));
    document.documentElement.style.setProperty("--v-scale", (scale * vf).toFixed(4));
  }

  applyLayoutScale();
  window.addEventListener("resize", applyLayoutScale);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", applyLayoutScale);

  function b64urlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    return decodeURIComponent(escape(atob(str)));
  }

  function clampStr(v, max) {
    return String(v == null ? "" : v).trim().slice(0, max);
  }

  function clampList(v, maxItems, maxLen) {
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var i = 0; i < v.length && out.length < maxItems; i++) {
      var s = clampStr(v[i], maxLen);
      if (s) out.push(s);
    }
    return out;
  }

  function normalizeProfile(data) {
    data = data && typeof data === "object" && !Array.isArray(data) ? data : {};
    var contacts = (Array.isArray(data.contacts) ? data.contacts : [])
      .slice(0, LIMITS.contactsMax)
      .map(function (c) {
        c = c && typeof c === "object" ? c : {};
        return {
          name: clampStr(c.name, LIMITS.contactName),
          phone: clampStr(c.phone, LIMITS.contactPhone),
          rel: clampStr(c.rel, LIMITS.contactRel)
        };
      })
      .filter(function (c) { return c.name || c.phone; });
    return {
      name: clampStr(data.name, LIMITS.name),
      dob: clampStr(data.dob, LIMITS.dob),
      blood: clampStr(data.blood, LIMITS.blood),
      donor: data.donor === true || data.donor === 1 || data.donor === "true" || data.donor === "1",
      allergies: clampList(data.allergies, LIMITS.listMax, LIMITS.listItem),
      meds: clampList(data.meds, LIMITS.listMax, LIMITS.listItem),
      conditions: clampList(data.conditions, LIMITS.listMax, LIMITS.listItem),
      contacts: contacts
    };
  }

  function decodeFromHash(hash) {
    var m = /d=([^&]+)/.exec(hash || "");
    if (!m) return null;
    var encoded = m[1];
    if (!encoded || encoded.length > LIMITS.dEncodedMax) return null;
    try {
      return normalizeProfile(JSON.parse(b64urlDecode(encoded)));
    } catch (e) {
      return null;
    }
  }

  function ageYears(dob) {
    if (!dob) return null;
    var d = new Date(dob + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    var t = new Date();
    var age = t.getFullYear() - d.getFullYear();
    var m = t.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
    return age;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function telHref(phone) {
    var digits = String(phone || "").replace(/[^0-9+]/g, "");
    return digits ? "tel:" + digits : null;
  }

  function buildTraumaIndex(raw) {
    var index = {};
    (raw || []).forEach(function (h) {
      if (!h || !h.s || !h.c) return;
      if (!index[h.s]) index[h.s] = {};
      if (!index[h.s][h.c]) index[h.s][h.c] = [];
      index[h.s][h.c].push(h);
    });
    Object.keys(index).forEach(function (st) {
      Object.keys(index[st]).forEach(function (city) {
        index[st][city].sort(function (a, b) { return (a.n || "").localeCompare(b.n || ""); });
      });
    });
    return index;
  }

  var ALL_US_STATES = [
    "AK", "AL", "AR", "AZ", "CA", "CO", "CT", "DC", "DE", "FL",
    "GA", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA",
    "MD", "ME", "MI", "MN", "MO", "MS", "MT", "NC", "ND", "NE",
    "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "RI",
    "SC", "SD", "TN", "TX", "UT", "VA", "VT", "WA", "WI", "WV", "WY"
  ];

  function traumaStates() {
    return ALL_US_STATES.slice();
  }

  function traumaCities(index, state, from) {
    if (!index[state]) return [];
    var names = Object.keys(index[state]);
    if (from) {
      names.sort(function (a, b) {
        return nearestCityDistance(from, index[state][a]) - nearestCityDistance(from, index[state][b]);
      });
    } else {
      names.sort();
    }
    return names;
  }

  function nearestCityDistance(from, hospitals) {
    if (!hospitals || !hospitals.length) return Infinity;
    return hospitals.reduce(function (best, h) {
      var d = traumaDistanceMiles(from, h);
      return d < best ? d : best;
    }, Infinity);
  }

  function traumaDistanceMiles(from, h) {
    if (!from || h.lat == null || h.lng == null) return Infinity;
    var R = 3958.8;
    var dLat = (h.lat - from.lat) * Math.PI / 180;
    var dLng = (h.lng - from.lng) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(from.lat * Math.PI / 180) * Math.cos(h.lat * Math.PI / 180)
      * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function traumaDistanceLabel(from, h) {
    var miles = traumaDistanceMiles(from, h);
    if (!isFinite(miles)) return "";
    if (miles < 0.2) return "Nearby";
    if (miles < 10) return miles.toFixed(1) + " mi";
    return Math.round(miles) + " mi";
  }

  function resolvedTrauma(index, state, city, from) {
    if (!state || !city || !index[state] || !index[state][city]) return [];
    var list = index[state][city].slice();
    if (from) {
      list.sort(function (a, b) {
        return traumaDistanceMiles(from, a) - traumaDistanceMiles(from, b);
      });
    }
    return list;
  }

  function mapsHref(h) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(h.lat + "," + h.lng);
  }

  function formatPhone(p) {
    var d = String(p || "").replace(/\D/g, "");
    if (d.length === 10) return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
    return p || "";
  }

  function renderHero(p) {
    var hero = el("div", "hero");
    hero.appendChild(el("p", "hero-kicker", "REDMED"));
    hero.appendChild(el("h1", null, p.name || "Medical ID"));
    var metaParts = [];
    var age = ageYears(p.dob);
    if (age != null) metaParts.push(age + " yrs");
    if (p.dob) metaParts.push("DOB " + p.dob);
    if (p.blood) metaParts.push("Blood " + p.blood);
    if (metaParts.length) hero.appendChild(el("p", "hero-meta", metaParts.join(" · ")));
    if (p.donor) hero.appendChild(el("span", "donor", "Organ donor"));
    return hero;
  }

  function renderList(title, items, critical) {
    var section = el("div", "section");
    section.appendChild(el("span", "pill " + (critical ? "pill-accent" : "pill-muted"), title));
    var list = el("div", "list" + (critical ? " list-crit" : " list-plain"));
    items.forEach(function (text) {
      var row = el("div", "row");
      row.appendChild(el("span", "dot"));
      row.appendChild(el("span", null, text));
      list.appendChild(row);
    });
    section.appendChild(list);
    return section;
  }

  function renderContacts(contacts) {
    var section = el("div", "section");
    section.appendChild(el("span", "pill pill-muted", "Emergency contacts"));
    contacts.forEach(function (c) {
      var card = el("div", "contact-card");
      var info = el("div");
      info.appendChild(el("div", "cname", c.name || "Contact"));
      if (c.rel) info.appendChild(el("div", "crel", c.rel));
      if (c.phone) info.appendChild(el("div", "cphone", c.phone));
      card.appendChild(info);
      var href = telHref(c.phone);
      if (href) {
        var call = el("a", "btn-pill", "Call");
        call.href = href;
        card.appendChild(call);
      }
      section.appendChild(card);
    });
    return section;
  }

  function renderTrauma(index) {
    var wrap = el("div", "section");
    var toggle = el("button", "trauma-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");
    toggle.appendChild(el("span", null, "Trauma center transport"));
    var chev = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    chev.setAttribute("viewBox", "0 0 10 10");
    chev.setAttribute("aria-hidden", "true");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M3 1l4 4-4 4");
    chev.appendChild(path);
    toggle.appendChild(chev);
    var panel = el("div", "trauma-panel");
    panel.appendChild(el("span", "pill pill-accent trauma-eyebrow", "Trauma hospitals"));
    panel.appendChild(el("p", "lead", "For transport when they may not survive if you wait for a closer hospital."));
    var traumaHint = el("p", null, "Pick your state and city — verified trauma centers only.");
    panel.appendChild(traumaHint);

    var userPos = null;
    function requestTraumaGPS() {
      if (!navigator.geolocation || userPos) return;
      navigator.geolocation.getCurrentPosition(function (pos) {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        traumaHint.textContent = "Pick your state and city — sorted closest to your GPS.";
        onStateChange();
        refreshList();
      }, function () {}, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }

    var stateField = el("div", "field");
    stateField.appendChild(el("label", null, "State"));
    var stateSel = el("select");
    stateSel.appendChild(el("option", null, "Select state"));
    traumaStates().forEach(function (st) {
      var opt = el("option", null, st);
      opt.value = st;
      stateSel.appendChild(opt);
    });
    stateField.appendChild(stateSel);
    panel.appendChild(stateField);

    var cityField = el("div", "field");
    cityField.style.display = "none";
    cityField.appendChild(el("label", null, "City"));
    var citySel = el("select");
    citySel.appendChild(el("option", null, "Select city"));
    cityField.appendChild(citySel);
    panel.appendChild(cityField);

    var listHost = el("div");
    panel.appendChild(listHost);
    var dispatchNote = el("p", null, "Call 911 first. Tell the dispatcher you need trauma-center transport and your location.");
    dispatchNote.style.display = "none";
    panel.appendChild(dispatchNote);

    function loadPersisted() {
      try {
        stateSel.value = localStorage.getItem(TRAUMA_STATE_KEY) || "";
        citySel.value = localStorage.getItem(TRAUMA_CITY_KEY) || "";
      } catch (e) {}
    }

    function persist() {
      try {
        localStorage.setItem(TRAUMA_STATE_KEY, stateSel.value || "");
        localStorage.setItem(TRAUMA_CITY_KEY, citySel.value || "");
      } catch (e) {}
    }

    function refreshList() {
      listHost.textContent = "";
      dispatchNote.style.display = "none";
      var st = stateSel.value;
      var city = citySel.value;
      if (!st || !city) return;
      var hospitals = resolvedTrauma(index, st, city, userPos);
      if (!hospitals.length) {
        listHost.appendChild(el("p", null, "None in this area"));
        return;
      }
      hospitals.forEach(function (h) {
        var card = el("div", "hospital-card");
        var body = el("div");
        body.style.flex = "1";
        body.appendChild(el("h3", null, h.n || "Hospital"));
        body.appendChild(el("p", null, "Level " + h.l + " trauma · " + (h.c || "") + ", " + (h.s || "")));
        var dist = traumaDistanceLabel(userPos, h);
        if (dist) body.appendChild(el("p", "trauma-dist", dist));
        if (h.p) body.appendChild(el("p", null, formatPhone(h.p)));
        card.appendChild(body);
        if (h.lat != null && h.lng != null) {
          var maps = el("a", "btn-maps", "Maps");
          maps.href = mapsHref(h);
          maps.target = "_blank";
          maps.rel = "noopener";
          card.appendChild(maps);
        }
        listHost.appendChild(card);
      });
      dispatchNote.style.display = "block";
    }

    function onStateChange() {
      citySel.textContent = "";
      citySel.appendChild(el("option", null, "Select city"));
      var st = stateSel.value;
      cityField.style.display = st ? "block" : "none";
      if (!st) {
        citySel.value = "";
        persist();
        refreshList();
        return;
      }
      traumaCities(index, st, userPos).forEach(function (city) {
        var opt = el("option", null, city);
        opt.value = city;
        citySel.appendChild(opt);
      });
      citySel.value = "";
      persist();
      refreshList();
    }

    stateSel.addEventListener("change", onStateChange);
    citySel.addEventListener("change", function () { persist(); refreshList(); });

    toggle.addEventListener("click", function () {
      var open = panel.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) requestTraumaGPS();
    });

    loadPersisted();
    if (stateSel.value) {
      onStateChange();
      citySel.value = localStorage.getItem(TRAUMA_CITY_KEY) || "";
      refreshList();
    }

    wrap.appendChild(toggle);
    wrap.appendChild(panel);
    return wrap;
  }

  function summaryText(p) {
    var lines = ["RedMed emergency summary"];
    if (p.name) lines.push("Name: " + p.name);
    if (p.blood) lines.push("Blood: " + p.blood);
    if (p.allergies.length) lines.push("Allergies: " + p.allergies.join(", "));
    if (p.conditions.length) lines.push("Conditions: " + p.conditions.join(", "));
    if (p.meds.length) lines.push("Meds: " + p.meds.join(", "));
    return lines.join("\n");
  }

  function attachScrollProgress(scroller) {
    var bar = document.getElementById("progressBar");
    if (!bar || !scroller) return;
    scroller.addEventListener("scroll", function () {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var pct = max > 0 ? Math.min(100, (scroller.scrollTop / max) * 100) : 0;
      bar.style.width = pct + "%";
    }, { passive: true });
  }

  function renderCard(p) {
    var root = document.getElementById("root");
    root.textContent = "";
    var shell = el("div", "shell atmosphere rm-atmosphere");
    var topbar = el("div", "topbar");
    topbar.appendChild(el("span", null, "EMERGENCY CARD"));
    shell.appendChild(topbar);

    var scroll = el("div");
    scroll.style.flex = "1";
    scroll.style.overflowY = "auto";
    scroll.style.webkitOverflowScrolling = "touch";

    scroll.appendChild(renderHero(p));

    var content = el("div", "content");
    var call = el("a", "btn btn-call rm-btn rm-btn-primary", "Call 911");
    call.href = "tel:911";
    content.appendChild(call);

    if (p.allergies.length) content.appendChild(renderList("Allergies", p.allergies, true));
    if (p.meds.length) content.appendChild(renderList("Medications", p.meds, false));
    if (p.conditions.length) content.appendChild(renderList("Medical conditions", p.conditions, false));
    if (p.contacts.length) content.appendChild(renderContacts(p.contacts));

    var copy = el("button", "btn btn-ink rm-btn rm-btn-ink", "Copy medical summary");
    copy.type = "button";
    copy.addEventListener("click", function () {
      var text = summaryText(p);
      var reset = function (label, delay) {
        copy.textContent = label;
        setTimeout(function () { copy.textContent = "Copy medical summary"; }, delay);
      };
      var succeeded = function () { reset("Copied!", 1500); };
      var failed = function () {
        var ok = false;
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e) { ok = false; }
        if (ok) succeeded();
        else reset("Couldn't copy — select text manually", 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(succeeded, failed);
      } else {
        failed();
      }
    });
    content.appendChild(copy);

    var traumaRaw = window.REDMED_TRAUMA_HOSPITALS || [];
    if (traumaRaw.length) content.appendChild(renderTrauma(buildTraumaIndex(traumaRaw)));

    content.appendChild(el("p", "note", "Tap the band → this card. Nothing saved to this phone."));

    if (!p.allergies.length && !p.meds.length && !p.conditions.length && !p.contacts.length) {
      content.appendChild(el("p", "note", "No allergies, meds, conditions, or contacts were written to this band."));
    }

    scroll.appendChild(content);
    shell.appendChild(scroll);
    root.appendChild(shell);
    attachScrollProgress(scroll);
  }

  function renderEmpty(title, body) {
    var root = document.getElementById("root");
    root.textContent = "";
    var shell = el("div", "shell atmosphere rm-atmosphere");
    var wrap = el("div", "empty");
    wrap.appendChild(el("p", "hero-kicker", "REDMED"));
    wrap.appendChild(el("h1", null, title));
    wrap.appendChild(el("p", null, body));
    shell.appendChild(wrap);
    root.appendChild(shell);
  }

  function isMobileHandheld() {
    var ua = navigator.userAgent || "";
    if (!ua || ua.length < 12) return false;
    if (/bot|crawler|spider|scanner|reader/i.test(ua)) return false;
    if (/iPhone|iPod/i.test(ua)) return true;
    if (/iPad/i.test(ua)) return true;
    if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
    if (/Android/i.test(ua)) return true;
    if (/Windows Phone/i.test(ua)) return true;
    return false;
  }

  function isOwnerPreview() {
    try { return new URLSearchParams(location.search).get("preview") === "1"; } catch (e) { return false; }
  }

  var profile = decodeFromHash(location.hash);
  if (profile && !isMobileHandheld() && !isOwnerPreview()) {
    renderEmpty("Phone or tablet required", "This bracelet works with smartphones and tablets — not desktop browsers or card readers.");
  } else if (profile) {
    renderCard(profile);
  } else {
    renderEmpty("Tap the band", "Hold any smartphone to a RedMed band — the browser opens the wearer's emergency card. No app needed.");
  }

  if ("serviceWorker" in navigator) {
    var registerSW = function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    };
    if ("requestIdleCallback" in window) requestIdleCallback(registerSW);
    else setTimeout(registerSW, 1);
  }
})();
</script>
</body>
</html>
