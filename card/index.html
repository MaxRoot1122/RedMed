<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedMed — Emergency Card</title>
<meta name="theme-color" content="#e11d48">
<meta name="description" content="RedMed emergency card — tap the band, phone opens instantly. Allergies, meds, Call 911. No app needed.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-NN24AR1zPXHPm/oYuZBm5DyZuk4LBMuAVrUI5H/Vu2E='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<style>
  @font-face {
    font-family: "DM Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("../assets/fonts/dm-sans-latin.woff2") format("woff2");
  }
  :root {
    --accent: #e11d48;
    --accent-dark: #bf1239;
    --accent-soft: rgba(225,29,72,.12);
    --ink: #1c1917;
    --muted: #78716c;
    --bg: #fff7f7;
    --card: rgba(255,255,255,.94);
    --line: rgba(28,25,23,.08);
    --scale: 1;
    --v-scale: 1;
    --pad: calc(16px * var(--scale));
    --radius: calc(18px * var(--scale));
    --inner: calc(12px * var(--scale));
    --dock-h: calc(76px * var(--v-scale) + env(safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "DM Sans", ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }
  a { color: inherit; text-decoration: none; }
  .shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .atmosphere {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 280px 280px at 0% 0%, rgba(225,29,72,.07), transparent 70%),
      radial-gradient(ellipse 320px 320px at 100% 100%, rgba(255,115,140,.05), transparent 70%);
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(10px * var(--v-scale) + env(safe-area-inset-top, 0px)) var(--pad) calc(10px * var(--v-scale));
    text-align: center;
    background: rgba(255,247,247,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar span {
    font-size: calc(11px * var(--scale));
    font-weight: 800;
    letter-spacing: 1.4px;
    color: var(--muted);
  }
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 30;
    pointer-events: none; background: rgba(0,0,0,.05);
  }
  .progress > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), rgba(225,29,72,.85));
    transition: width .08s linear;
  }
  .hero {
    color: #fff;
    padding: calc(24px * var(--v-scale)) var(--pad) calc(26px * var(--v-scale));
    background:
      linear-gradient(145deg, #f43f5e 0%, var(--accent) 42%, var(--accent-dark) 100%);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute; inset: auto -20% -40% 40%;
    height: 140%;
    background: radial-gradient(circle, rgba(255,255,255,.14), transparent 62%);
    pointer-events: none;
  }
  .hero-kicker {
    margin: 0 0 calc(8px * var(--v-scale));
    font-size: calc(11px * var(--scale));
    font-weight: 800;
    letter-spacing: 1.8px;
    color: rgba(255,255,255,.88);
  }
  .hero h1 {
    margin: 0;
    font-size: calc(28px * var(--scale));
    font-weight: 800;
    letter-spacing: -.6px;
    overflow-wrap: anywhere;
    word-break: break-word;
    hyphens: auto;
    position: relative;
  }
  .hero-chips {
    display: flex; flex-wrap: wrap; gap: calc(8px * var(--scale));
    margin-top: calc(14px * var(--v-scale));
    position: relative;
  }
  .chip {
    display: inline-flex; align-items: center;
    padding: calc(6px * var(--scale)) calc(11px * var(--scale));
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.22);
    font-size: calc(13px * var(--scale));
    font-weight: 700;
    color: #fff;
  }
  .chip-blood {
    background: #fff;
    color: var(--accent-dark);
    border-color: #fff;
    font-weight: 800;
    font-size: calc(15px * var(--scale));
    letter-spacing: .2px;
  }
  .content {
    padding: var(--pad);
    padding-bottom: calc(18px * var(--v-scale) + var(--dock-h));
    display: flex;
    flex-direction: column;
    gap: calc(16px * var(--v-scale));
  }
  .reveal {
    opacity: 0;
    transform: translateY(10px);
    animation: rise .42s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .reveal:nth-child(1) { animation-delay: .02s; }
  .reveal:nth-child(2) { animation-delay: .07s; }
  .reveal:nth-child(3) { animation-delay: .12s; }
  .reveal:nth-child(4) { animation-delay: .17s; }
  .reveal:nth-child(5) { animation-delay: .22s; }
  .reveal:nth-child(6) { animation-delay: .27s; }
  .reveal:nth-child(7) { animation-delay: .32s; }
  @keyframes rise {
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; animation: none; }
  }
  .btn {
    display: block; width: 100%;
    border: 0; border-radius: 999px;
    font: inherit; text-align: center; cursor: pointer;
    text-decoration: none;
  }
  .btn-call {
    padding: calc(16px * var(--v-scale));
    font-size: calc(20px * var(--scale));
    font-weight: 800;
    color: #fff;
    background: linear-gradient(180deg, #fb7185, var(--accent));
    border: 0.5px solid rgba(255,255,255,.34);
    box-shadow: 0 calc(6px * var(--scale)) calc(18px * var(--scale)) rgba(225,29,72,.28);
  }
  .btn-ink {
    padding: calc(14px * var(--v-scale));
    font-size: calc(15px * var(--scale));
    font-weight: 800;
    color: #fff;
    background: var(--ink);
  }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    padding: calc(10px * var(--v-scale)) var(--pad) calc(10px * var(--v-scale) + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(255,247,247,0), rgba(255,247,247,.92) 28%, rgba(255,247,247,.98));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .section { display: flex; flex-direction: column; gap: calc(10px * var(--v-scale)); }
  .pill {
    display: inline-block; align-self: flex-start;
    font-size: calc(10px * var(--scale));
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    padding: calc(5px * var(--scale)) calc(10px * var(--scale));
    border-radius: 999px;
  }
  .pill-accent { color: var(--accent); background: var(--accent-soft); }
  .pill-muted { color: var(--muted); background: rgba(120,113,108,.1); }
  .list { display: flex; flex-direction: column; gap: calc(8px * var(--v-scale)); }
  .list-crit {
    padding: calc(14px * var(--scale));
    border-radius: var(--inner);
    background: var(--accent-soft);
    border: 1px solid rgba(225,29,72,.14);
  }
  .list-ok {
    padding: calc(14px * var(--scale));
    border-radius: var(--inner);
    background: rgba(22,163,74,.08);
    border: 1px solid rgba(22,163,74,.16);
    color: #166534;
    font-size: calc(15px * var(--scale));
    font-weight: 700;
  }
  .row {
    display: flex; gap: calc(10px * var(--scale)); align-items: flex-start;
  }
  .dot {
    width: calc(6px * var(--scale)); height: calc(6px * var(--scale));
    margin-top: calc(7px * var(--scale)); flex: none;
    border-radius: 50%; background: var(--accent);
  }
  .row span { font-size: calc(16px * var(--scale)); font-weight: 650; }
  .list-plain .row span { font-weight: 550; }
  .contact-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(10px * var(--scale));
    padding: calc(12px * var(--scale)) 0;
    border-bottom: 1px solid var(--line);
  }
  .contact-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .contact-row:first-child { padding-top: 0; }
  .cname { font-weight: 750; font-size: calc(16px * var(--scale)); }
  .crel, .cphone { font-size: calc(13px * var(--scale)); color: var(--muted); margin-top: 2px; font-weight: 550; }
  .btn-pill {
    flex: none;
    padding: calc(11px * var(--scale)) calc(16px * var(--scale));
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: calc(14px * var(--scale));
    font-weight: 800;
  }
  .note {
    font-size: calc(12px * var(--scale));
    font-weight: 600;
    color: var(--muted);
    margin: 0;
  }
  .trauma-toggle {
    width: 100%; border: 0; background: none; padding: 0;
    display: flex; align-items: center; justify-content: space-between;
    font: inherit; cursor: pointer; color: var(--ink);
  }
  .trauma-toggle span {
    font-size: calc(14px * var(--scale));
    font-weight: 800;
  }
  .trauma-toggle svg { width: calc(12px * var(--scale)); fill: var(--muted); transition: transform .2s; }
  .trauma-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .trauma-panel {
    display: none;
    margin-top: calc(12px * var(--v-scale));
    padding: calc(14px * var(--v-scale));
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .trauma-panel.open { display: block; }
  .trauma-panel p { margin: 0 0 calc(8px * var(--v-scale)); font-size: calc(12px * var(--scale)); color: var(--muted); }
  .trauma-panel p.lead { font-weight: 700; color: rgba(28,25,23,.85); }
  .field { margin-bottom: calc(10px * var(--v-scale)); }
  .field label {
    display: block; margin-bottom: calc(4px * var(--v-scale));
    font-size: calc(11px * var(--scale)); font-weight: 700; color: var(--muted);
  }
  .field select {
    width: 100%; padding: calc(10px * var(--scale));
    font: inherit; font-size: calc(14px * var(--scale));
    border: 1px solid var(--line); border-radius: calc(10px * var(--scale));
    background: #fff; color: var(--ink);
  }
  .hospital-card {
    display: flex; gap: calc(10px * var(--scale)); align-items: flex-start;
    padding: calc(10px * var(--v-scale)); margin-top: calc(8px * var(--v-scale));
    background: rgba(255,255,255,.82);
    border: 1px solid var(--line);
    border-radius: var(--inner);
  }
  .hospital-card h3 {
    margin: 0; font-size: calc(14px * var(--scale)); font-weight: 800;
  }
  .hospital-card p { margin: calc(2px * var(--v-scale)) 0 0; font-size: calc(11px * var(--scale)); color: var(--muted); font-weight: 600; }
  .btn-maps {
    flex: none; align-self: center;
    padding: calc(7px * var(--scale)) calc(10px * var(--scale));
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: calc(11px * var(--scale)); font-weight: 800;
  }
  .empty {
    max-width: min(420px, 100%); margin: 0 auto;
    padding: calc(48px * var(--v-scale)) var(--pad);
    padding-top: calc(48px * var(--v-scale) + env(safe-area-inset-top, 0px));
    text-align: center;
  }
  .empty h1 { margin: calc(10px * var(--v-scale)) 0 calc(6px * var(--v-scale)); font-size: calc(22px * var(--scale)); font-weight: 800; }
  .empty p { margin: 0; font-size: calc(14px * var(--scale)); color: var(--muted); font-weight: 550; }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
<div id="root"></div>
<script src="../assets/trauma-hospitals.js"></script>
<script>
(function () {
  "use strict";

  var LIMITS = {
    name: 120, dob: 32, blood: 16, listItem: 80, listMax: 32,
    contactName: 80, contactPhone: 32, contactRel: 160, contactsMax: 4,
    dEncodedMax: 8192
  };
  var BASELINE_W = 393;
  var BASELINE_VIEWPORT_H = 710;
  var COUNTY_THRESHOLD = 30;
  var TRAUMA_STATE_KEY = "redMedTraumaState";
  var TRAUMA_COUNTY_KEY = "redMedTraumaCounty";
  // High-acuity keywords — surface these conditions with the same urgency as allergies.
  var ACUITY_RE = /seizure|epilep|gefs|febrile|shunt|anaphylax|diabetes|insulin|anticoag|warfarin|eliquis|xarelto|asthma|pacemaker|icd\b|transplant|hemophil|bleeding disorder|adrenal|addison|airway|tracheostom|vp\/?sp|tonic.?clonic|status epilepticus|c1.?c2|cervical fusion/i;

  function applyLayoutScale() {
    var w = window.innerWidth;
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    h = Math.max(480, h);
    var blended = (w / BASELINE_W) * 0.38 + (h / BASELINE_VIEWPORT_H) * 0.62;
    var scale = Math.min(1.04, Math.max(0.78, blended));
    var vf = h < 620 ? 0.82 : h < 680 ? 0.88 : h < 740 ? 0.93 : 1;
    document.documentElement.style.setProperty("--scale", scale.toFixed(4));
    document.documentElement.style.setProperty("--v-scale", (scale * vf).toFixed(4));
  }

  applyLayoutScale();
  window.addEventListener("resize", applyLayoutScale);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", applyLayoutScale);

  function b64urlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    return decodeURIComponent(escape(atob(str)));
  }

  function clampStr(v, max) {
    return String(v == null ? "" : v).trim().slice(0, max);
  }

  function clampList(v, maxItems, maxLen) {
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var i = 0; i < v.length && out.length < maxItems; i++) {
      var s = clampStr(v[i], maxLen);
      if (s) out.push(s);
    }
    return out;
  }

  function normalizeProfile(data) {
    data = data && typeof data === "object" && !Array.isArray(data) ? data : {};
    var contacts = (Array.isArray(data.contacts) ? data.contacts : [])
      .slice(0, LIMITS.contactsMax)
      .map(function (c) {
        c = c && typeof c === "object" ? c : {};
        return {
          name: clampStr(c.name, LIMITS.contactName),
          phone: clampStr(c.phone, LIMITS.contactPhone),
          rel: clampStr(c.rel, LIMITS.contactRel)
        };
      })
      .filter(function (c) { return c.name || c.phone; });
    return {
      name: clampStr(data.name, LIMITS.name),
      dob: clampStr(data.dob, LIMITS.dob),
      blood: clampStr(data.blood, LIMITS.blood),
      donor: data.donor === true || data.donor === 1 || data.donor === "true" || data.donor === "1",
      allergies: clampList(data.allergies, LIMITS.listMax, LIMITS.listItem),
      meds: clampList(data.meds, LIMITS.listMax, LIMITS.listItem),
      conditions: clampList(data.conditions, LIMITS.listMax, LIMITS.listItem),
      contacts: contacts
    };
  }

  function decodeFromHash(hash) {
    var m = /d=([^&]+)/.exec(hash || "");
    if (!m) return null;
    var encoded = m[1];
    if (!encoded || encoded.length > LIMITS.dEncodedMax) return null;
    try {
      return normalizeProfile(JSON.parse(b64urlDecode(encoded)));
    } catch (e) {
      return null;
    }
  }

  function ageYears(dob) {
    if (!dob) return null;
    var d = new Date(dob + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    var t = new Date();
    var age = t.getFullYear() - d.getFullYear();
    var m = t.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
    return age;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function telHref(phone) {
    var digits = String(phone || "").replace(/[^0-9+]/g, "");
    return digits ? "tel:" + digits : null;
  }

  function isHighAcuity(text) {
    return ACUITY_RE.test(String(text || ""));
  }

  function partitionConditions(items) {
    var critical = [];
    var other = [];
    items.forEach(function (t) {
      if (isHighAcuity(t)) critical.push(t);
      else other.push(t);
    });
    return { critical: critical, other: other };
  }

  function buildTraumaIndex(raw) {
    var index = {};
    (raw || []).forEach(function (h) {
      if (!h || !h.s) return;
      if (!index[h.s]) index[h.s] = {};
      var co = h.co || "";
      if (!index[h.s][co]) index[h.s][co] = [];
      index[h.s][co].push(h);
    });
    Object.keys(index).forEach(function (st) {
      Object.keys(index[st]).forEach(function (co) {
        index[st][co].sort(function (a, b) { return (a.n || "").localeCompare(b.n || ""); });
      });
    });
    return index;
  }

  function traumaStates(index) {
    return Object.keys(index).sort();
  }

  function traumaCounties(index, state) {
    if (!index[state]) return [];
    return Object.keys(index[state]).sort();
  }

  function traumaHospitalsInState(index, state) {
    if (!index[state]) return [];
    return traumaCounties(index, state).reduce(function (acc, co) {
      return acc.concat(index[state][co]);
    }, []).sort(function (a, b) { return (a.n || "").localeCompare(b.n || ""); });
  }

  function needsCounty(index, state) {
    return traumaHospitalsInState(index, state).length >= COUNTY_THRESHOLD;
  }

  function resolvedTrauma(index, state, county) {
    if (!state) return [];
    if (needsCounty(index, state)) {
      if (!county || !index[state] || !index[state][county]) return [];
      return index[state][county];
    }
    return traumaHospitalsInState(index, state);
  }

  function mapsHref(h) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(h.lat + "," + h.lng);
  }

  function formatPhone(p) {
    var d = String(p || "").replace(/\D/g, "");
    if (d.length === 10) return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
    return p || "";
  }

  function renderHero(p) {
    var hero = el("div", "hero");
    hero.appendChild(el("p", "hero-kicker", "REDMED"));
    hero.appendChild(el("h1", null, p.name || "Medical ID"));
    var chips = el("div", "hero-chips");
    if (p.blood) chips.appendChild(el("span", "chip chip-blood", "Blood " + p.blood));
    var age = ageYears(p.dob);
    if (age != null) chips.appendChild(el("span", "chip", age + " yrs"));
    if (p.dob) chips.appendChild(el("span", "chip", "DOB " + p.dob));
    if (p.donor) chips.appendChild(el("span", "chip", "Organ donor"));
    if (chips.childNodes.length) hero.appendChild(chips);
    return hero;
  }

  function renderList(title, items, critical) {
    var section = el("div", "section reveal");
    section.appendChild(el("span", "pill " + (critical ? "pill-accent" : "pill-muted"), title));
    var list = el("div", "list" + (critical ? " list-crit" : " list-plain"));
    items.forEach(function (text) {
      var row = el("div", "row");
      row.appendChild(el("span", "dot"));
      row.appendChild(el("span", null, text));
      list.appendChild(row);
    });
    section.appendChild(list);
    return section;
  }

  function renderNkda() {
    var section = el("div", "section reveal");
    section.appendChild(el("span", "pill pill-muted", "Allergies"));
    section.appendChild(el("div", "list-ok", "No known allergies"));
    return section;
  }

  function renderContacts(contacts) {
    var section = el("div", "section reveal");
    section.appendChild(el("span", "pill pill-muted", "Emergency contacts"));
    contacts.forEach(function (c) {
      var row = el("div", "contact-row");
      var info = el("div");
      info.appendChild(el("div", "cname", c.name || "Contact"));
      if (c.rel) info.appendChild(el("div", "crel", c.rel));
      if (c.phone) info.appendChild(el("div", "cphone", c.phone));
      row.appendChild(info);
      var href = telHref(c.phone);
      if (href) {
        var call = el("a", "btn-pill", "Call");
        call.href = href;
        row.appendChild(call);
      }
      section.appendChild(row);
    });
    return section;
  }

  function renderTrauma(index) {
    var wrap = el("div", "section reveal");
    var toggle = el("button", "trauma-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");
    toggle.appendChild(el("span", null, "Trauma center transport"));
    var chev = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    chev.setAttribute("viewBox", "0 0 10 10");
    chev.setAttribute("aria-hidden", "true");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M3 1l4 4-4 4");
    chev.appendChild(path);
    toggle.appendChild(chev);
    var panel = el("div", "trauma-panel");
    panel.appendChild(el("p", "lead", "For transport when they may not survive if you wait for a closer hospital."));
    panel.appendChild(el("p", null, "Verified trauma centers only — pick your state. County appears only when the list is long (30+)."));

    var stateField = el("div", "field");
    stateField.appendChild(el("label", null, "State"));
    var stateSel = el("select");
    stateSel.appendChild(el("option", null, "Select state"));
    traumaStates(index).forEach(function (st) {
      var opt = el("option", null, st);
      opt.value = st;
      stateSel.appendChild(opt);
    });
    stateField.appendChild(stateSel);
    panel.appendChild(stateField);

    var countyField = el("div", "field");
    countyField.style.display = "none";
    countyField.appendChild(el("label", null, "County"));
    var countySel = el("select");
    countySel.appendChild(el("option", null, "Select county"));
    countyField.appendChild(countySel);
    panel.appendChild(countyField);

    var listHost = el("div");
    panel.appendChild(listHost);
    var dispatchNote = el("p", null, "Call 911 first. Tell the dispatcher you need trauma-center transport and your location.");
    dispatchNote.style.display = "none";
    panel.appendChild(dispatchNote);

    function loadPersisted() {
      try {
        stateSel.value = localStorage.getItem(TRAUMA_STATE_KEY) || "";
        countySel.value = localStorage.getItem(TRAUMA_COUNTY_KEY) || "";
      } catch (e) {}
    }

    function persist() {
      try {
        localStorage.setItem(TRAUMA_STATE_KEY, stateSel.value || "");
        localStorage.setItem(TRAUMA_COUNTY_KEY, countySel.value || "");
      } catch (e) {}
    }

    function refreshList() {
      listHost.textContent = "";
      dispatchNote.style.display = "none";
      var st = stateSel.value;
      var co = countySel.value;
      if (!st) return;
      var showCounty = needsCounty(index, st);
      countyField.style.display = showCounty ? "block" : "none";
      if (showCounty && !co) return;
      var hospitals = resolvedTrauma(index, st, co);
      if (!hospitals.length) {
        listHost.appendChild(el("p", null, "None in this area"));
        return;
      }
      hospitals.forEach(function (h) {
        var card = el("div", "hospital-card");
        var body = el("div");
        body.style.flex = "1";
        body.appendChild(el("h3", null, h.n || "Hospital"));
        body.appendChild(el("p", null, "Level " + h.l + " trauma · " + (h.c || "") + ", " + (h.s || "")));
        if (h.p) body.appendChild(el("p", null, formatPhone(h.p)));
        card.appendChild(body);
        if (h.lat != null && h.lng != null) {
          var maps = el("a", "btn-maps", "Maps");
          maps.href = mapsHref(h);
          maps.target = "_blank";
          maps.rel = "noopener";
          card.appendChild(maps);
        }
        listHost.appendChild(card);
      });
      dispatchNote.style.display = "block";
    }

    function onStateChange() {
      countySel.textContent = "";
      countySel.appendChild(el("option", null, "Select county"));
      traumaCounties(index, stateSel.value).forEach(function (co) {
        var opt = el("option", null, co);
        opt.value = co;
        countySel.appendChild(opt);
      });
      countySel.value = "";
      persist();
      refreshList();
    }

    stateSel.addEventListener("change", onStateChange);
    countySel.addEventListener("change", function () { persist(); refreshList(); });

    toggle.addEventListener("click", function () {
      var open = panel.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });

    loadPersisted();
    if (stateSel.value) {
      onStateChange();
      countySel.value = localStorage.getItem(TRAUMA_COUNTY_KEY) || "";
      refreshList();
    }

    wrap.appendChild(toggle);
    wrap.appendChild(panel);
    return wrap;
  }

  function summaryText(p) {
    var lines = ["RedMed emergency summary"];
    if (p.name) lines.push("Name: " + p.name);
    if (p.blood) lines.push("Blood: " + p.blood);
    if (p.allergies.length) lines.push("Allergies: " + p.allergies.join(", "));
    else lines.push("Allergies: No known allergies");
    if (p.conditions.length) lines.push("Conditions: " + p.conditions.join(", "));
    if (p.meds.length) lines.push("Meds: " + p.meds.join(", "));
    return lines.join("\n");
  }

  function attachScrollProgress(scroller) {
    var bar = document.getElementById("progressBar");
    if (!bar || !scroller) return;
    scroller.addEventListener("scroll", function () {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var pct = max > 0 ? Math.min(100, (scroller.scrollTop / max) * 100) : 0;
      bar.style.width = pct + "%";
    }, { passive: true });
  }

  function renderCard(p) {
    var root = document.getElementById("root");
    root.textContent = "";
    var shell = el("div", "shell atmosphere");
    var topbar = el("div", "topbar");
    topbar.appendChild(el("span", null, "EMERGENCY CARD"));
    shell.appendChild(topbar);

    var scroll = el("div");
    scroll.style.flex = "1";
    scroll.style.overflowY = "auto";
    scroll.style.webkitOverflowScrolling = "touch";

    scroll.appendChild(renderHero(p));

    var content = el("div", "content");

    // Clinical order: allergies → high-acuity conditions → other conditions → meds → contacts
    if (p.allergies.length) content.appendChild(renderList("Allergies", p.allergies, true));
    else content.appendChild(renderNkda());

    var parts = partitionConditions(p.conditions);
    if (parts.critical.length) content.appendChild(renderList("Critical conditions", parts.critical, true));
    if (parts.other.length) content.appendChild(renderList("Medical conditions", parts.other, false));
    if (p.meds.length) content.appendChild(renderList("Medications", p.meds, false));
    if (p.contacts.length) content.appendChild(renderContacts(p.contacts));

    var copy = el("button", "btn btn-ink reveal", "Copy medical summary");
    copy.type = "button";
    copy.addEventListener("click", function () {
      var text = summaryText(p);
      var reset = function (label, delay) {
        copy.textContent = label;
        setTimeout(function () { copy.textContent = "Copy medical summary"; }, delay);
      };
      var succeeded = function () { reset("Copied!", 1500); };
      var failed = function () {
        var ok = false;
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e) { ok = false; }
        if (ok) succeeded();
        else reset("Couldn't copy — select text manually", 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(succeeded, failed);
      } else {
        failed();
      }
    });
    content.appendChild(copy);

    var traumaRaw = window.REDMED_TRAUMA_HOSPITALS || [];
    if (traumaRaw.length) content.appendChild(renderTrauma(buildTraumaIndex(traumaRaw)));

    content.appendChild(el("p", "note reveal", "Tap the band → this card. Nothing saved to this phone, nothing sent to a server."));

    if (!p.allergies.length && !p.meds.length && !p.conditions.length && !p.contacts.length) {
      content.appendChild(el("p", "note reveal", "No allergies, meds, conditions, or contacts were written to this band."));
    }

    scroll.appendChild(content);
    shell.appendChild(scroll);

    var dock = el("div", "dock");
    var call = el("a", "btn btn-call", "Call 911");
    call.href = "tel:911";
    dock.appendChild(call);
    shell.appendChild(dock);

    root.appendChild(shell);
    attachScrollProgress(scroll);
  }

  function renderEmpty(title, body) {
    var root = document.getElementById("root");
    root.textContent = "";
    var shell = el("div", "shell atmosphere");
    var wrap = el("div", "empty");
    wrap.appendChild(el("p", "hero-kicker", "REDMED"));
    wrap.appendChild(el("h1", null, title));
    wrap.appendChild(el("p", null, body));
    shell.appendChild(wrap);
    root.appendChild(shell);
  }

  function isSmartphone() {
    var ua = navigator.userAgent || "";
    if (!ua || ua.length < 12) return false;
    if (/bot|crawler|spider|scanner|reader/i.test(ua)) return false;
    if (/iPad/.test(ua)) return false;
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return false;
    if (/iPhone|iPod/.test(ua)) return true;
    if (/Android/i.test(ua) && /Mobile/i.test(ua)) return true;
    if (/Windows Phone/i.test(ua)) return true;
    return false;
  }

  function isOwnerPreview() {
    try { return new URLSearchParams(location.search).get("preview") === "1"; } catch (e) { return false; }
  }

  var profile = decodeFromHash(location.hash);
  if (profile && !isSmartphone() && !isOwnerPreview()) {
    renderEmpty("Smartphone required", "This bracelet works with smartphones only — not card readers or other NFC devices.");
  } else if (profile) {
    renderCard(profile);
  } else {
    renderEmpty("Tap the band", "Hold any smartphone to a RedMed band — the browser opens the wearer's emergency card. No app needed.");
  }

  if ("serviceWorker" in navigator) {
    var registerSW = function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    };
    if ("requestIdleCallback" in window) requestIdleCallback(registerSW);
    else setTimeout(registerSW, 1);
  }
})();
</script>
</body>
</html>
