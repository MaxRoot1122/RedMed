<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RedMed Design Pages 1–7 — Edit</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: #12141a;
      --ink: #f4f5f7;
      --muted: #9aa3ad;
      --accent: #e10600;
      --line: #2a2f38;
      --gap: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #14171d 0%, #0b0c0e 40%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(11, 12, 14, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--accent); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .file-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #1a1e27;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 650;
    }
    button:hover, .file-btn:hover { filter: brightness(1.08); }
    .hint {
      width: 100%;
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .board {
      display: flex;
      gap: var(--gap);
      padding: 18px;
      overflow-x: auto;
      align-items: stretch;
      scroll-snap-type: x mandatory;
    }
    .panel {
      flex: 0 0 min(320px, 82vw);
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      min-height: 70vh;
    }
    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      background: color-mix(in srgb, var(--accent) 22%, #000);
      color: #ffb4ae;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 999px;
    }
    .panel img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 10px;
      background: #000;
      border: 1px solid var(--line);
    }
    .panel [contenteditable="true"] {
      outline: none;
      border-radius: 8px;
      padding: 4px 2px;
    }
    .panel [contenteditable="true"]:focus {
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.25;
      font-weight: 750;
    }
    .lead, .body, li {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 8px;
    }
    .stat {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }
    .stat .value {
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 800;
    }
    .card {
      background: #0b0c0e;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--line);
    }
    .cards { display: grid; gap: 8px; }
    footer {
      padding: 0 18px 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    code { color: #d7dde5; }
  </style>
</head>
<body>
  <header>
    <h1><span>RedMed</span> · Design pages 1–7 side by side</h1>
    <div class="actions">
      <button type="button" id="reloadPhotos">Reload photos</button>
      <button type="button" id="exportJson">Export copy JSON</button>
      <button type="button" class="primary" id="saveLocal">Save edits</button>
    </div>
    <p class="hint">Click any text to edit. Photos come from <code>assets/design-pages/photo-N.png</code>. Edits save to this browser’s localStorage.</p>
  </header>

  <section class="board" id="board" aria-label="Design pages 1 through 7"></section>

  <footer>
    Composite reference: <code>assets/design-pages/photos-1-7-side-by-side.png</code>
  </footer>

  <script>
    const PAGES = [
      {
        id: 1,
        eyebrow: "Next generation solutions",
        title: "Reducing Human Suffering",
        lead: "A passive NFC medical ID, built for the one moment a QR code can't handle.",
        bullets: []
      },
      {
        id: 2,
        eyebrow: "The problem",
        title: "Fails You When You Need It Most",
        lead: "",
        bullets: [
          "QR codes need clean light — never work in the dark, rain, or blood.",
          "Most hide the code inside the band, under an unconscious wrist.",
          "Apple Health needs the right iPhone, unlocked, and a responder who knows to look.",
          "Android has no lock-screen medical ID — Google Health isn't there when a stranger taps."
        ]
      },
      {
        id: 3,
        eyebrow: "Tap the band",
        title: "A Tap, Not a Scan",
        lead: "Any phone taps the band — profile opens instantly, no app.",
        bullets: [
          "Two Screens. One Tap. Zero Friction.",
          "First aid and emergency contacts, with 911 as the obvious next step.",
          "No battery, no server, no breach — it just works, forever."
        ]
      },
      {
        id: 4,
        eyebrow: "The competitive landscape",
        title: "Faster Than Anything Else on the Market",
        lead: "Android readers: tap opens your card in Chrome. No RedMed install — works, just not fancy.",
        bullets: [
          "Works in dark or rain",
          "No app for the reader",
          "Program band on your phone",
          "Any phone reads the band"
        ]
      },
      {
        id: 5,
        eyebrow: "Regulatory primer",
        title: "Built Outside HIPAA's Reach — By Design",
        lead: "",
        bullets: [
          "RedMed is not a HIPAA covered entity or business associate — direct-to-consumer wearables generally fall outside HIPAA, and with no server there is no centralized PHI store to breach.",
          "Still in scope for the FTC Health Breach Notification Rule and state health-data laws. Local-only architecture minimizes exposure.",
          "Tag data is intentionally unencrypted so any responder's phone can read it instantly — the same tradeoff every medical ID bracelet makes, disclosed up front."
        ]
      },
      {
        id: 6,
        eyebrow: "No subscriptions",
        title: "One Product, One Payment, No Servers to Run",
        lead: "",
        bullets: [
          "One band, one purchase — no subscription.",
          "No servers to run — profile lives on the chip and phone.",
          "Replace, don't repair — re-write or program a new band.",
          "Passive forever — no battery, no charging, no pairing."
        ]
      },
      {
        id: 7,
        eyebrow: "The market",
        title: "A Fast-Growing, Underserved Market",
        lead: "",
        stats: [
          { value: "$1.4B", label: "Medical ID bracelets", detail: "Global market projected by 2033." },
          { value: "$28.6B", label: "Medical alert systems", detail: "Broader alert market growing ~11% annually." },
          { value: "~2.3M", label: "Daily smartwatch users", detail: "U.S. consumers who already carry a tap-ready device." }
        ],
        bullets: []
      }
    ];

    const KEY = "redmed-design-pages-1-7";

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return structuredClone(PAGES);
        return JSON.parse(raw);
      } catch {
        return structuredClone(PAGES);
      }
    }

    function text(el, value) {
      el.textContent = value || "";
      el.setAttribute("contenteditable", "true");
      el.spellcheck = true;
    }

    function render(pages) {
      const board = document.getElementById("board");
      board.innerHTML = "";
      pages.forEach((page) => {
        const panel = document.createElement("article");
        panel.className = "panel";
        panel.dataset.id = page.id;

        const top = document.createElement("div");
        top.className = "panel-top";
        top.innerHTML = `<span class="badge">Page ${page.id}</span>`;
        panel.appendChild(top);

        const img = document.createElement("img");
        img.src = `photo-${page.id}.png?v=${Date.now()}`;
        img.alt = `Design photo ${page.id}`;
        panel.appendChild(img);

        const eyebrow = document.createElement("div");
        eyebrow.className = "eyebrow";
        text(eyebrow, page.eyebrow);
        panel.appendChild(eyebrow);

        const title = document.createElement("h2");
        title.className = "title";
        text(title, page.title);
        panel.appendChild(title);

        if (page.lead) {
          const lead = document.createElement("p");
          lead.className = "lead";
          text(lead, page.lead);
          panel.appendChild(lead);
        }

        if (page.bullets && page.bullets.length) {
          const ul = document.createElement("ul");
          page.bullets.forEach((b) => {
            const li = document.createElement("li");
            text(li, b);
            ul.appendChild(li);
          });
          panel.appendChild(ul);
        }

        if (page.stats && page.stats.length) {
          const wrap = document.createElement("div");
          wrap.className = "cards";
          page.stats.forEach((s) => {
            const card = document.createElement("div");
            card.className = "card stat";
            const value = document.createElement("div");
            value.className = "value";
            text(value, s.value);
            const label = document.createElement("div");
            label.className = "title";
            label.style.fontSize = "0.95rem";
            text(label, s.label);
            const detail = document.createElement("div");
            detail.className = "body";
            text(detail, s.detail);
            card.append(value, label, detail);
            wrap.appendChild(card);
          });
          panel.appendChild(wrap);
        }

        board.appendChild(panel);
      });
    }

    function collect() {
      return [...document.querySelectorAll(".panel")].map((panel) => {
        const id = Number(panel.dataset.id);
        const eyebrow = panel.querySelector(".eyebrow")?.innerText.trim() || "";
        const title = panel.querySelector("h2.title")?.innerText.trim() || "";
        const lead = panel.querySelector("p.lead")?.innerText.trim() || "";
        const bullets = [...panel.querySelectorAll("ul li")].map((li) => li.innerText.trim()).filter(Boolean);
        const stats = [...panel.querySelectorAll(".stat")].map((card) => ({
          value: card.querySelector(".value")?.innerText.trim() || "",
          label: card.querySelector(".title")?.innerText.trim() || "",
          detail: card.querySelector(".body")?.innerText.trim() || ""
        }));
        const page = { id, eyebrow, title, lead, bullets };
        if (stats.length) page.stats = stats;
        return page;
      });
    }

    const state = load();
    render(state);

    document.getElementById("saveLocal").onclick = () => {
      localStorage.setItem(KEY, JSON.stringify(collect(), null, 2));
      alert("Saved locally. Export JSON when you want it in the repo.");
    };

    document.getElementById("exportJson").onclick = () => {
      const blob = new Blob([JSON.stringify(collect(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "design-pages-1-7.json";
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById("reloadPhotos").onclick = () => render(collect());
  </script>
</body>
</html>
