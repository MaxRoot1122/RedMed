# Deploy to Cloudflare Pages — card/ (bracelet taps), legal, get.html (band setup QR).
# Moved off GitHub Pages intentionally: the old github.io URL tied the public
# bracelet URL to the owner's personal GitHub username. Served from
# https://redmed.pages.dev/ instead (or whatever CF_PAGES_PROJECT is set to —
# see repo variable below, must match the Cloudflare Pages project name).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pin to commit SHAs (not mutable tags) — bracelet cards load this deploy.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static site
        run: |
          mkdir -p _site/.well-known _site/config _site/card
          cp privacy-policy.html terms-of-service.html get.html _site/
          cp -R assets _site/assets
          cp card/index.html card/sw.js _site/card/
          # Universal Links — must be at domain root with no file extension
          cp .well-known/apple-app-site-association _site/.well-known/apple-app-site-association
          cp .well-known/apple-app-site-association _site/apple-app-site-association
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_MAPS_API_KEY }}" > _site/config/google-api-key
          elif [ -f config/google-api-key ]; then
            cp config/google-api-key _site/config/google-api-key
          else
            : > _site/config/google-api-key
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT || 'redmed' }}
          directory: _site
          branch: main
