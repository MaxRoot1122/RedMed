# Build the Android TWA wrapper on push/PR.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3b3044f3974b5810e85f253c4fa343180f3de3fe # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
