<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedMed — Emergency Card</title>
<meta name="theme-color" content="#e11d48">
<meta name="description" content="RedMed emergency card — tap the band, phone opens instantly. Allergies, meds, Call 911. No app needed.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-0Zq47TDdtewzsmi6WU7A5CVTjpwpw0GLWHdKmeqdC0Y='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<style>
  :root {
    --accent: #e11d48;
    --accent-dark: #bf1237;
    --accent-soft: rgba(225,29,72,.1);
    --ink: #1c1917;
    --muted: #78716c;
    --bg: #fff7f7;
    --line: rgba(28,25,23,.08);
    --pad: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  a { color: inherit; }
  .header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: calc(28px + env(safe-area-inset-top, 0px)) var(--pad) 36px;
  }
  .eyebrow {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,.85);
  }
  .header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
    word-break: break-word;
  }
  .meta { margin: 8px 0 0; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.9); }
  .donor {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
    font-size: 12px;
    font-weight: 800;
  }
  .body {
    max-width: 480px;
    margin: 0 auto;
    padding: 18px var(--pad) calc(36px + env(safe-area-inset-bottom, 0px));
  }
  .btn {
    display: block;
    width: 100%;
    margin: 0 0 10px;
    padding: 18px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 17px;
    font-weight: 750;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-call {
    padding: 20px;
    font-size: 19px;
    color: #fff;
    background: linear-gradient(180deg, #fb7185, var(--accent));
  }
  .btn-copy { color: #fff; background: var(--ink); }
  .section { margin-top: 22px; }
  .label {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label.crit { color: var(--accent); }
  .block { border-radius: 14px; padding: 14px; }
  .block.crit { background: var(--accent-soft); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
  .dot {
    width: 7px; height: 7px; margin-top: 8px; flex: none;
    border-radius: 50%; background: var(--accent);
  }
  .item span { font-size: 16px; font-weight: 600; }
  .contact {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 10px; padding: 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
  }
  .cname { font-weight: 700; font-size: 16px; }
  .crel, .cphone { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .call {
    flex: none;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
  }
  .note { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
  .footer a { font-weight: 700; color: var(--accent); text-decoration: none; }
  .empty { max-width: 420px; margin: 0 auto; padding: 60px var(--pad); text-align: center; }
  .empty h1 { margin: 12px 0 8px; font-size: 24px; font-weight: 800; }
  .empty p { margin: 0; font-size: 15px; color: var(--muted); font-weight: 550; }
  .empty p + p { margin-top: 10px; }
  @media (max-width: 360px) {
    :root { --pad: 16px; }
    .header h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  var LIMITS = {
    name: 120, dob: 32, blood: 16, listItem: 80, listMax: 32,
    contactName: 80, contactPhone: 32, contactRel: 160, contactsMax: 4,
    dEncodedMax: 8192
  };

  function b64urlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    return decodeURIComponent(escape(atob(str)));
  }

  function clampStr(v, max) {
    return String(v == null ? "" : v).trim().slice(0, max);
  }

  function clampList(v, maxItems, maxLen) {
    if (!Array.isArray(v)) return [];
    var out = [];
    for (var i = 0; i < v.length && out.length < maxItems; i++) {
      var s = clampStr(v[i], maxLen);
      if (s) out.push(s);
    }
    return out;
  }

  function normalizeProfile(data) {
    data = data && typeof data === "object" && !Array.isArray(data) ? data : {};
    var contacts = (Array.isArray(data.contacts) ? data.contacts : [])
      .slice(0, LIMITS.contactsMax)
      .map(function (c) {
        c = c && typeof c === "object" ? c : {};
        return {
          name: clampStr(c.name, LIMITS.contactName),
          phone: clampStr(c.phone, LIMITS.contactPhone),
          rel: clampStr(c.rel, LIMITS.contactRel)
        };
      })
      .filter(function (c) { return c.name || c.phone; });
    return {
      name: clampStr(data.name, LIMITS.name),
      dob: clampStr(data.dob, LIMITS.dob),
      blood: clampStr(data.blood, LIMITS.blood),
      donor: data.donor === true || data.donor === 1 || data.donor === "true" || data.donor === "1",
      allergies: clampList(data.allergies, LIMITS.listMax, LIMITS.listItem),
      meds: clampList(data.meds, LIMITS.listMax, LIMITS.listItem),
      conditions: clampList(data.conditions, LIMITS.listMax, LIMITS.listItem),
      contacts: contacts
    };
  }

  function decodeFromHash(hash) {
    var m = /d=([^&]+)/.exec(hash || "");
    if (!m) return null;
    var encoded = m[1];
    if (!encoded || encoded.length > LIMITS.dEncodedMax) return null;
    try {
      return normalizeProfile(JSON.parse(b64urlDecode(encoded)));
    } catch (e) {
      return null;
    }
  }

  function ageYears(dob) {
    if (!dob) return null;
    var d = new Date(dob + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    var t = new Date();
    var age = t.getFullYear() - d.getFullYear();
    var m = t.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
    return age;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function telHref(phone) {
    var digits = String(phone || "").replace(/[^0-9+]/g, "");
    return digits ? "tel:" + digits : null;
  }

  function renderHeader(p) {
    var header = el("div", "header");
    header.appendChild(el("p", "eyebrow", "REDMED"));
    header.appendChild(el("p", "eyebrow", "EMERGENCY CARD"));
    header.appendChild(el("h1", null, p.name || "Medical ID"));
    var metaParts = [];
    var age = ageYears(p.dob);
    if (age != null) metaParts.push(age + " yrs");
    if (p.dob) metaParts.push("DOB " + p.dob);
    if (p.blood) metaParts.push("Blood " + p.blood);
    if (metaParts.length) header.appendChild(el("p", "meta", metaParts.join(" · ")));
    if (p.donor) header.appendChild(el("span", "donor", "Organ donor"));
    return header;
  }

  function renderList(title, items, critical) {
    var section = el("div", "section");
    section.appendChild(el("p", "label" + (critical ? " crit" : ""), title));
    var block = el("div", "block" + (critical ? " crit" : ""));
    items.forEach(function (text) {
      var item = el("div", "item");
      item.appendChild(el("span", "dot"));
      item.appendChild(el("span", null, text));
      block.appendChild(item);
    });
    section.appendChild(block);
    return section;
  }

  function renderContacts(contacts) {
    var section = el("div", "section");
    section.appendChild(el("p", "label", "Emergency contacts"));
    contacts.forEach(function (c) {
      var card = el("div", "contact");
      var info = el("div");
      info.appendChild(el("div", "cname", c.name || "Contact"));
      if (c.rel) info.appendChild(el("div", "crel", c.rel));
      if (c.phone) info.appendChild(el("div", "cphone", c.phone));
      card.appendChild(info);
      var href = telHref(c.phone);
      if (href) {
        var call = el("a", "call", "Call");
        call.href = href;
        card.appendChild(call);
      }
      section.appendChild(card);
    });
    return section;
  }

  function summaryText(p) {
    var lines = ["RedMed emergency summary"];
    if (p.name) lines.push("Name: " + p.name);
    if (p.blood) lines.push("Blood: " + p.blood);
    if (p.allergies.length) lines.push("Allergies: " + p.allergies.join(", "));
    if (p.conditions.length) lines.push("Conditions: " + p.conditions.join(", "));
    if (p.meds.length) lines.push("Meds: " + p.meds.join(", "));
    return lines.join("\n");
  }

  function renderCard(p) {
    var root = document.getElementById("root");
    root.textContent = "";
    root.appendChild(renderHeader(p));

    var body = el("div", "body");
    var call = el("a", "btn btn-call", "Call 911");
    call.href = "tel:911";
    body.appendChild(call);

    if (p.allergies.length) body.appendChild(renderList("Allergies", p.allergies, true));
    if (p.meds.length) body.appendChild(renderList("Medications", p.meds, false));
    if (p.conditions.length) body.appendChild(renderList("Medical conditions", p.conditions, false));
    if (p.contacts.length) body.appendChild(renderContacts(p.contacts));

    var copy = el("button", "btn btn-copy", "Copy medical summary");
    copy.type = "button";
    copy.addEventListener("click", function () {
      var text = summaryText(p);
      var reset = function (label, delay) {
        copy.textContent = label;
        setTimeout(function () { copy.textContent = "Copy medical summary"; }, delay);
      };
      var succeeded = function () { reset("Copied!", 1500); };
      var failed = function () {
        var ok = false;
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e) { ok = false; }
        if (ok) succeeded();
        else reset("Couldn't copy — select text manually", 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(succeeded, failed);
      } else {
        failed();
      }
    });
    body.appendChild(copy);

    body.appendChild(el("p", "note", "Tap the band → this card. Nothing saved to this phone."));

    if (!p.allergies.length && !p.meds.length && !p.conditions.length && !p.contacts.length) {
      body.appendChild(el("p", "note", "No allergies, meds, conditions, or contacts were written to this band."));
    }

    var footer = el("p", "footer");
    footer.appendChild(document.createTextNode("Own this band? "));
    var link = el("a", null, "Program it on iPhone");
    link.href = "../get.html";
    footer.appendChild(link);
    body.appendChild(footer);

    root.appendChild(body);
  }

  function renderEmpty() {
    var root = document.getElementById("root");
    root.textContent = "";
    var wrap = el("div", "empty");
    wrap.appendChild(el("p", "eyebrow", "REDMED"));
    wrap.appendChild(el("h1", null, "Tap the band"));
    wrap.appendChild(el("p", null, "Hold any smartphone to a RedMed band — the browser opens the wearer's emergency card. No app needed."));
    root.appendChild(wrap);
  }

  function isSmartphone() {
    var ua = navigator.userAgent || "";
    if (!ua || ua.length < 12) return false;
    if (/bot|crawler|spider|scanner|reader/i.test(ua)) return false;
    if (/iPad/.test(ua)) return false;
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return false;
    if (/iPhone|iPod/.test(ua)) return true;
    if (/Android/i.test(ua) && /Mobile/i.test(ua)) return true;
    if (/Windows Phone/i.test(ua)) return true;
    return false;
  }

  function isOwnerPreview() {
    try { return new URLSearchParams(location.search).get("preview") === "1"; } catch (e) { return false; }
  }

  function renderPhoneGate() {
    var root = document.getElementById("root");
    root.textContent = "";
    var wrap = el("div", "empty");
    wrap.appendChild(el("p", "eyebrow", "REDMED"));
    wrap.appendChild(el("h1", null, "Smartphone required"));
    wrap.appendChild(el("p", null, "This bracelet works with smartphones only — not card readers or other NFC devices."));
    root.appendChild(wrap);
  }

  var profile = decodeFromHash(location.hash);
  if (profile && !isSmartphone() && !isOwnerPreview()) {
    renderPhoneGate();
  } else if (profile) {
    renderCard(profile);
  } else {
    renderEmpty();
  }

  if ("serviceWorker" in navigator) {
    var registerSW = function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    };
    if ("requestIdleCallback" in window) requestIdleCallback(registerSW);
    else setTimeout(registerSW, 1);
  }
})();
</script>
</body>
</html>
